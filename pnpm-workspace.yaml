packages:
  - packages/*
  - internals/*
allowBuilds:
  "@parcel/watcher": true
  core-js: true
  es5-ext: true
  esbuild: true
  msw: true
  vue-demi: true
catalog:
  "@types/node": ^22.20.1
  "@vitest/coverage-v8": ^4.1.11
  "@vitest/ui": ^4.1.11
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  "tinyexec": ^1.3.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vitest: ^4.1.11
  yaml: ^2.9.0
minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
# Native platform bindings are always co-published with their parent package in the same release.
# Excluding them avoids false-positive ERR_PNPM_NO_MATURE_MATCHING_VERSION errors.
minimumReleaseAgeExclude:
  - "@types/*"
pmOnFail: warn
resolutionMode: highest
