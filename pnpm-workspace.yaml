packages:
  - packages/*
  - internals/*
  - tools/*
allowBuilds:
  "@parcel/watcher": true
  core-js: true
  es5-ext: true
  esbuild: true
  msw: true
catalog:
  "@types/node": 22.20.2
  "@vitest/coverage-v8": ^5.0.5
  "@vitest/ui": ^5.0.5
  js-yaml: ^5.5.0
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  "tinyexec": ^1.3.1
  tsdown: 0.23.1 # 0.23.2 pulls rolldown-plugin-dts 0.29 beta, which cannot find the TypeScript 7 API and fails every build
  typescript: ^7.0.2
  vitest: ^5.0.5
  yaml: ^2.9.1
minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
# Native platform bindings are always co-published with their parent package in the same release.
# Excluding them avoids false-positive ERR_PNPM_NO_MATURE_MATCHING_VERSION errors.
# @kubb/* and kubb are our own packages, published from this repo, so the age limit doesn't apply.
minimumReleaseAgeExclude:
  - "@types/*"
  - "@kubb/*"
  - "kubb"
pmOnFail: warn
resolutionMode: highest
