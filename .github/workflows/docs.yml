name: Docs

# kubb.dev renders docs/ from main, so a docs change asks kubb-labs/platform to redeploy it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'context7.json'
  workflow_dispatch:

permissions: {}

jobs:
  deploy-platform:
    name: Dispatch content-updated to platform
    if: github.repository_owner == 'kubb-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          repository: kubb-labs/platform
          event-type: content-updated
          client-payload: '{"source": "kubb", "ref": "${{ github.ref_name }}"}'

  context7:
    name: Refresh Context7
    if: github.repository_owner == 'kubb-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Job-level, because a step `if:` can't read secrets or the step's own env.
    env:
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
    steps:
      # Skipped until the CONTEXT7_API_KEY secret is set.
      - name: Trigger Context7 refresh
        if: env.CONTEXT7_API_KEY != ''
        continue-on-error: true
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n --arg name "/$REPOSITORY" '{libraryName: $name}' |
            curl -fsS -X POST https://context7.com/api/v1/refresh \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
              --data @-
