name: Release
on:
  workflow_dispatch:
  push:
    branches: ['main', 'alpha', 'beta', 'rc']
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'tools/claude/**'
      - '.github/workflows/release.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository_owner == 'kubb-labs'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # id-token: write enables npm OIDC trusted publishing — no NPM_TOKEN needed.
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      issues: write
    outputs:
      staged: ${{ steps.release.outputs.staged }}
      staged_packages: ${{ steps.release.outputs.staged_packages }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          cache: 'false'
          force-install: 'true'

      - name: Build
        run: pnpm run build

      - name: Release
        id: release
        uses: kubb-labs/config/.github/actions/release@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Keeps tools/claude/.claude-plugin/plugin.json's version in step with the
          # @kubb/claude-plugin package.json that Changesets bumps.
          # changesets/action runs this without a shell, so `&&` can't chain
          # commands here — pnpm run does its own shell chaining instead.
          version-script: pnpm run release:version

      # Canary skips staging on purpose, so it stays automatic on every push.
      - name: Publish canary
        if: ${{ steps.release.outputs.staged != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
        # The 0.0.0 base guarantees canaries sort below any real release.
        # --no-git-checks: the first bump dirties the tree, which would make
        # pnpm version refuse for every package after it.
        run: |
          canary_version="0.0.0-canary-$(date -u +%Y%m%d%H%M%S)"
          echo "Canary version: ${canary_version}"
          pnpm -r exec pnpm version "${canary_version}" --no-git-tag-version --allow-same-version --no-git-checks
          pnpm run build
          pnpm exec changeset publish --tag canary

  promote:
    name: Promote staged release
    needs: [release]
    if: ${{ needs.release.outputs.staged == 'true' }}
    environment:
      name: npm-release-approval
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      issues: write # release comments on issues
      pull-requests: write # release comments on PRs
    outputs:
      approved: ${{ steps.promote.outputs.approved }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          cache: 'false'

      # One combined release for the whole version, not one per package: every
      # published package here sits in one fixed version group (see
      # .changeset/config.json), so per-package releases would just repeat
      # the same version number across a dozen separate pages.
      - name: Promote
        id: promote
        uses: kubb-labs/config/.github/actions/promote@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          staged-packages: ${{ needs.release.outputs.staged_packages }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-mode: combined

  notify:
    name: Send Discord Notification
    needs: [release, promote]
    if: ${{ needs.promote.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    # Job-level, because a step `if:` can't read secrets or the step's own env.
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send a discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          RELEASES_URL: https://github.com/${{ github.repository }}/releases
        run: |
          jq -n --arg url "$RELEASES_URL" '{content: "A new release is available 🎉. \n [Read the changelog](\($url))"}' |
            curl -fsS -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
